name: Build and Push Frontend Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every translation has every message, with the same placeholders and tags as English.
      - name: Check translations
        run: npm run check:i18n

      # Type-checks and bundles, the same as the image build.
      - name: Type-check and build
        run: npm run build

  build:
    # Only publish images for main; pull requests just run the checks.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.kanbancord.com
            VITE_DISCORD_CLIENT_ID=${{ vars.VITE_DISCORD_CLIENT_ID }}
            VITE_DISCORD_REDIRECT_URI=https://kanbancord.com
            VITE_DISCORD_SCOPES=identify guilds
          tags: |
            ghcr.io/ryuji-ly/kanbancord-frontend:latest
            ghcr.io/ryuji-ly/kanbancord-frontend:${{ github.sha }}
