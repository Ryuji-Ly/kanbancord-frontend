# The web app handles its own routes (/boards/1 and so on), so any path that is not a real file
# gets index.html; the app then shows the right page. Without this, opening or reloading such a
# link directly returns 404. Public pages (/faq, /guides/...) are also built as their own .html
# files, served first, so they arrive already rendered.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Pages (and the few other files here) must always be checked, so a new release is picked up
    # straight away.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Built files have a hash in their name, so they can be cached for good.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
